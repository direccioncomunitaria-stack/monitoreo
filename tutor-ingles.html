<title>Ruta de Inglés — 16 semanas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#F4F7F5; --card:#FFFFFF; --ink:#22312E; --muted:#5E6E69;
    --primary:#14655A; --primary-deep:#0C4B43; --soft:#E2EFE9; --softer:#EEF5F1;
    --amber:#B9741A; --amber-soft:#F7ECDB;
    --ok:#2E8F63; --ok-soft:#E2F2E9; --bad:#C4574E; --bad-soft:#F9E8E6;
    --line:#DCE4E0; --radius:14px;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;font-size:16px}
  button{font-family:var(--sans);cursor:pointer}
  .wrap{max-width:680px;margin:0 auto;padding:0 18px 80px}

  /* Top bar */
  .topbar{position:sticky;top:0;z-index:20;background:var(--primary-deep);color:#fff}
  .topbar-in{max-width:680px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
  .topbar .brand{font-family:var(--serif);font-size:1.05rem;font-weight:600;letter-spacing:.01em;white-space:nowrap}
  .topbar .brand button{all:unset;cursor:pointer;font:inherit;color:inherit}
  .globalbar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
  .globalbar>div{height:100%;background:#8FD3B8;border-radius:3px;transition:width .4s ease}
  .pct{font-variant-numeric:tabular-nums;font-size:.8rem;opacity:.9;min-width:38px;text-align:right}
  .gear{all:unset;cursor:pointer;font-size:1.05rem;padding:2px 4px;border-radius:6px}
  .gear:focus-visible{outline:2px solid #8FD3B8}

  /* Hero (home) */
  .hero{padding:34px 0 8px}
  .eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.7rem;font-weight:700;color:var(--primary)}
  h1{font-family:var(--serif);font-weight:600;font-size:2rem;margin:.25rem 0 .4rem;text-wrap:balance}
  .lede{color:var(--muted);margin:0;max-width:52ch}
  .stats{display:flex;gap:10px;margin:20px 0 6px;flex-wrap:wrap}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 16px;flex:1;min-width:120px}
  .stat b{display:block;font-size:1.35rem;font-family:var(--serif);font-variant-numeric:tabular-nums;color:var(--primary-deep)}
  .stat span{font-size:.75rem;color:var(--muted)}

  .month{margin-top:30px}
  .month-h{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--primary);padding-bottom:6px;margin-bottom:12px}
  .month-h .mn{font-family:var(--serif);font-size:1.15rem;font-weight:600;color:var(--primary-deep)}
  .month-h .mt{color:var(--muted);font-size:.85rem}
  .weeks{display:flex;flex-direction:column;gap:8px}
  .week-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;width:100%;text-align:left;transition:border-color .15s}
  .week-row:not(:disabled):hover{border-color:var(--primary)}
  .week-row:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .week-row:disabled{opacity:.55;cursor:not-allowed;background:var(--softer)}
  .wnum{font-family:var(--serif);font-size:1.1rem;font-weight:600;color:var(--primary);min-width:2ch;font-variant-numeric:tabular-nums}
  .wmain{flex:1}
  .wtitle{font-weight:600;font-size:.95rem}
  .wgoal{font-size:.78rem;color:var(--muted)}
  .dots{display:flex;gap:4px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--ok)}
  .wstate{font-size:1rem}

  /* Cards & common */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .btn{border:none;border-radius:10px;padding:11px 18px;font-size:.95rem;font-weight:600;background:var(--primary);color:#fff}
  .btn:hover{background:var(--primary-deep)}
  .btn:focus-visible{outline:2px solid var(--primary-deep);outline-offset:2px}
  .btn.sec{background:var(--soft);color:var(--primary-deep)}
  .btn.sec:hover{background:#d3e6dd}
  .btn.ghost{background:transparent;color:var(--primary-deep);border:1px solid var(--line)}
  .btn.warn{background:var(--bad)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .back{all:unset;cursor:pointer;color:var(--primary);font-weight:600;font-size:.85rem;display:inline-block;margin:18px 0 4px;padding:4px 0}
  .back:focus-visible{outline:2px solid var(--primary)}

  /* Week screen */
  .wk-head h2{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:.2rem 0}
  .goalbox{background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;margin:12px 0}
  .tip{background:var(--softer);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;font-size:.92rem;margin:14px 0}
  .tip h3{margin:0 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--primary)}
  .tip em{font-family:var(--serif);font-style:italic}
  .mods{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .mod-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;width:100%;text-align:left}
  .mod-row:hover{border-color:var(--primary)}
  .mod-row:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .mod-ico{width:38px;height:38px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex:none}
  .mod-row.done .mod-ico{background:var(--ok-soft)}
  .mod-name{font-weight:600;font-size:.95rem}
  .mod-sub{font-size:.78rem;color:var(--muted)}
  .mod-check{margin-left:auto;color:var(--ok);font-weight:700}

  /* Exercise screens */
  .ex-top{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
  .ex-title{font-family:var(--serif);font-size:1.2rem;font-weight:600}
  .ex-prog{margin-left:auto;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .pbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
  .pbar>div{height:100%;background:var(--primary);transition:width .3s}
  .phrase-es{font-size:.95rem;color:var(--muted);margin:0 0 6px}
  .phrase-en{font-family:var(--serif);font-size:1.5rem;font-weight:600;line-height:1.35;margin:0;text-wrap:balance}
  .hidden-en{filter:blur(0);}
  .center{text-align:center}
  .exd{min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:8px}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
  .opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .opt{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;font-size:1rem;text-align:left;font-family:var(--serif)}
  .opt:hover{border-color:var(--primary)}
  .opt:focus-visible{outline:2px solid var(--primary)}
  .opt.right{background:var(--ok-soft);border-color:var(--ok)}
  .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
  .feedback{margin-top:14px;font-weight:600;min-height:1.5em}
  .feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
  input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:1rem;font-family:var(--sans);background:#fff;color:var(--ink)}
  input[type=text]:focus{outline:2px solid var(--primary);border-color:var(--primary)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:46px;padding:10px;border:1px dashed var(--line);border-radius:10px;margin-bottom:12px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-family:var(--serif);font-size:1rem}
  .chip:hover{border-color:var(--primary)}
  .chip.placed{background:var(--soft);border-color:var(--primary)}
  .transcript{background:var(--softer);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-family:var(--serif);font-style:italic;min-height:2.6em;margin-top:12px;color:var(--ink)}
  .score-pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:700}
  .score-pill.ok{background:var(--ok-soft);color:var(--ok)}
  .score-pill.mid{background:var(--amber-soft);color:var(--amber)}
  .score-pill.bad{background:var(--bad-soft);color:var(--bad)}
  .mic{width:64px;height:64px;border-radius:50%;border:none;background:var(--bad);color:#fff;font-size:1.5rem;transition:transform .15s}
  .mic.idle{background:var(--primary)}
  .mic:hover{transform:scale(1.06)}
  .mic:focus-visible{outline:3px solid var(--soft)}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
  .note{font-size:.8rem;color:var(--muted)}
  .result-big{font-family:var(--serif);font-size:1.6rem;font-weight:600;margin:10px 0}
  .review-card{margin-top:16px;background:linear-gradient(135deg,var(--primary-deep),var(--primary));color:#fff;border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .review-card .rc-main{flex:1;min-width:200px}
  .review-card h2{font-family:var(--serif);font-size:1.15rem;font-weight:600;margin:0 0 3px}
  .review-card p{margin:0;font-size:.85rem;opacity:.85}
  .review-card .btn{background:#fff;color:var(--primary-deep)}
  .review-card .btn:hover{background:var(--soft)}
  .review-card .btn:disabled{opacity:.6}
  .boxes{display:flex;gap:3px;margin-top:8px}
  .boxes span{height:6px;border-radius:3px;background:rgba(255,255,255,.25);flex:1;max-width:44px}
  .boxes span.f{background:#8FD3B8}
  .method{margin-top:34px}
  .method h2{font-family:var(--serif);font-size:1.2rem;font-weight:600;border-bottom:2px solid var(--primary);padding-bottom:6px}
  .method ol{padding-left:20px;margin:10px 0;font-size:.92rem;color:var(--ink)}
  .method li{margin-bottom:6px}
  dialog{border:none;border-radius:var(--radius);padding:22px;max-width:340px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(20,40,35,.45)}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:6px 12px;font-size:.85rem}
  .seg button.on{background:var(--primary);color:#fff}
</style>

<div class="topbar"><div class="topbar-in">
  <div class="brand"><button id="homeBtn" aria-label="Ir al inicio">Ruta de Inglés</button></div>
  <div class="globalbar" aria-hidden="true"><div id="gbar" style="width:0%"></div></div>
  <div class="pct" id="gpct">0%</div>
  <button class="gear" id="gearBtn" aria-label="Ajustes">⚙</button>
</div></div>

<div class="wrap" id="app" aria-live="polite"></div>

<dialog id="setDlg">
  <h3 style="margin:0 0 10px;font-family:var(--serif)">Ajustes</h3>
  <div class="set-row"><span>Velocidad de la voz</span>
    <div class="seg" id="rateSeg">
      <button data-r="0.7">Lenta</button><button data-r="0.9">Media</button><button data-r="1">Normal</button>
    </div>
  </div>
  <div class="set-row"><span>Modo libre<br><small class="note">Desbloquea todas las semanas</small></span>
    <div class="seg" id="freeSeg"><button data-f="0">No</button><button data-f="1">Sí</button></div>
  </div>
  <div class="set-row" style="border:none"><span>Reiniciar todo el progreso</span>
    <button class="btn warn" id="resetBtn" style="padding:7px 12px;font-size:.8rem">Reiniciar</button>
  </div>
  <div class="row"><button class="btn sec" id="closeDlg">Cerrar</button></div>
</dialog>

<script>
"use strict";
/* ================= DATA ================= */
const MONTHS = [
  {n:1, title:"Supervivencia oral", sub:"Presentarte y hablar de tu vida"},
  {n:2, title:"Contar cosas", sub:"Pasado, planes y opiniones"},
  {n:3, title:"Fluidez y reacción", sub:"Sonar natural y no quedarte sin palabras"},
  {n:4, title:"Mundo real", sub:"Trabajo, errores crónicos y evaluación"},
];
const WEEKS = [
{n:1,m:1,title:"Presentarte",goal:"Decir quién sos, de dónde sos y a qué te dedicás, sin frenarte.",
 tip:"<h3>Mini-lección</h3>Para presentarte usás el verbo <em>to be</em> (ser/estar): <em>I'm Ana, I'm from Argentina</em>. Para lo que hacés, presente simple: <em>I work at a school, I live in Buenos Aires</em>. Truco: armá tu \"guion de vida\" con estas frases y decilo en voz alta hasta que salga solo.",
 phrases:[
  {en:"Hi, nice to meet you.",es:"Hola, encantado/a de conocerte."},
  {en:"I'm from Argentina.",es:"Soy de Argentina."},
  {en:"I live in Buenos Aires.",es:"Vivo en Buenos Aires."},
  {en:"I work at a school.",es:"Trabajo en una escuela."},
  {en:"I'm learning English.",es:"Estoy aprendiendo inglés."},
  {en:"I have two children.",es:"Tengo dos hijos."},
  {en:"I really like music.",es:"Me gusta mucho la música."},
  {en:"I've been working there for five years.",es:"Trabajo ahí desde hace cinco años."},
  {en:"What about you?",es:"¿Y vos?"},
  {en:"See you later!",es:"¡Nos vemos!"}],
 prompts:[
  {en:"Introduce yourself: name, city and job.",es:"Presentate: nombre, ciudad y trabajo."},
  {en:"Talk about your family for 30 seconds.",es:"Hablá de tu familia durante 30 segundos."},
  {en:"Say three things you like.",es:"Decí tres cosas que te gustan."}]},
{n:2,m:1,title:"Tu rutina",goal:"Contar tu día usando presente simple y expresiones de frecuencia.",
 tip:"<h3>Mini-lección</h3>El presente simple describe hábitos: <em>I get up at seven</em>. Las palabras de frecuencia van antes del verbo: <em>I <b>usually</b> have coffee, I <b>never</b> work on Sundays</em>. Truco de la semana: mientras hacés tu rutina, narrala en inglés en tu cabeza (\"Now I'm having breakfast\").",
 phrases:[
  {en:"I usually get up at seven.",es:"Normalmente me levanto a las siete."},
  {en:"I have breakfast with my family.",es:"Desayuno con mi familia."},
  {en:"I go to work by bus.",es:"Voy al trabajo en colectivo."},
  {en:"I start work at eight o'clock.",es:"Empiezo a trabajar a las ocho."},
  {en:"I have lunch at noon.",es:"Almuerzo al mediodía."},
  {en:"On Mondays I have meetings.",es:"Los lunes tengo reuniones."},
  {en:"In the evening I watch TV.",es:"A la noche miro televisión."},
  {en:"I go to bed late.",es:"Me acuesto tarde."},
  {en:"I never work on Sundays.",es:"Nunca trabajo los domingos."},
  {en:"Once a week I do exercise.",es:"Una vez por semana hago ejercicio."}],
 prompts:[
  {en:"Describe your typical morning.",es:"Describí una mañana típica tuya."},
  {en:"What do you do on weekends?",es:"¿Qué hacés los fines de semana?"},
  {en:"Describe your whole day, from morning to night.",es:"Contá tu día completo, de la mañana a la noche."}]},
{n:3,m:1,title:"Hacer preguntas",goal:"Dominar las preguntas básicas: la conversación es preguntar.",
 tip:"<h3>Mini-lección</h3>Las preguntas en presente usan <em>do/does</em>: <em>Do you like your job? What do you do?</em> Con el verbo <em>to be</em> se invierte: <em>Where are you from?</em> Truco: en cualquier charla, el que pregunta controla la conversación con la mitad del esfuerzo.",
 phrases:[
  {en:"What do you do?",es:"¿A qué te dedicás?"},
  {en:"Where are you from?",es:"¿De dónde sos?"},
  {en:"Where do you live?",es:"¿Dónde vivís?"},
  {en:"Do you have any kids?",es:"¿Tenés hijos?"},
  {en:"Do you like your job?",es:"¿Te gusta tu trabajo?"},
  {en:"How old are you?",es:"¿Cuántos años tenés?"},
  {en:"How long have you lived there?",es:"¿Hace cuánto vivís ahí?"},
  {en:"What do you do in your free time?",es:"¿Qué hacés en tu tiempo libre?"},
  {en:"Can you help me, please?",es:"¿Me podés ayudar, por favor?"},
  {en:"What time is it?",es:"¿Qué hora es?"}],
 prompts:[
  {en:"Ask five questions to get to know someone.",es:"Hacé cinco preguntas para conocer a alguien."},
  {en:"Imagine you meet a tourist. Ask about their trip.",es:"Imaginá que conocés a un turista. Preguntale por su viaje."},
  {en:"Answer out loud: What do you do? Where do you live?",es:"Respondé en voz alta: ¿a qué te dedicás? ¿dónde vivís?"}]},
{n:4,m:1,title:"Situaciones básicas",goal:"Sobrevivir en un bar, un negocio o la calle — y pedir que te repitan.",
 tip:"<h3>Mini-lección</h3>Las frases de cortesía usan <em>could</em> y <em>would</em>: <em>Could you say that again? I'd like a coffee</em>. Son fórmulas fijas: no las analices, memorizalas como bloques. <b>Checkpoint del mes:</b> grabate 3 minutos presentándote y guardá el audio para comparar en el mes 4.",
 phrases:[
  {en:"Could you say that again, please?",es:"¿Podrías repetir eso, por favor?"},
  {en:"What does this word mean?",es:"¿Qué significa esta palabra?"},
  {en:"Can you speak more slowly?",es:"¿Podés hablar más despacio?"},
  {en:"I'd like a coffee, please.",es:"Quisiera un café, por favor."},
  {en:"How much is it?",es:"¿Cuánto cuesta?"},
  {en:"Can I pay by card?",es:"¿Puedo pagar con tarjeta?"},
  {en:"Excuse me, where is the bathroom?",es:"Disculpá, ¿dónde está el baño?"},
  {en:"How do I get to the station?",es:"¿Cómo llego a la estación?"},
  {en:"I don't understand.",es:"No entiendo."},
  {en:"The check, please.",es:"La cuenta, por favor."}],
 prompts:[
  {en:"Order a full meal at a restaurant.",es:"Pedí una comida completa en un restaurante."},
  {en:"Ask for directions to a museum.",es:"Pedí indicaciones para llegar a un museo."},
  {en:"Record yourself: introduce yourself for 3 minutes.",es:"Grabate: presentate durante 3 minutos (checkpoint del mes)."}]},
{n:5,m:2,title:"Hablar en pasado",goal:"Contar qué hiciste ayer con los verbos irregulares más usados.",
 tip:"<h3>Mini-lección</h3>Los verbos irregulares más frecuentes hay que sabérselos de memoria: <em>go→went, see→saw, have→had, say→said, make→made, take→took, come→came, get→got</em>. La negación usa <em>didn't</em> + verbo base: <em>I didn't sleep well</em>. Ritual diario: antes de dormir, contá en voz alta tres cosas que hiciste hoy.",
 phrases:[
  {en:"Yesterday I went to work early.",es:"Ayer fui a trabajar temprano."},
  {en:"I saw a great movie last night.",es:"Anoche vi una película buenísima."},
  {en:"I had a very busy day.",es:"Tuve un día muy ocupado."},
  {en:"She said something funny.",es:"Ella dijo algo gracioso."},
  {en:"We made dinner together.",es:"Hicimos la cena juntos."},
  {en:"I took the bus this morning.",es:"Tomé el colectivo esta mañana."},
  {en:"They came to my house.",es:"Vinieron a mi casa."},
  {en:"I got home late.",es:"Llegué tarde a casa."},
  {en:"I didn't sleep well.",es:"No dormí bien."},
  {en:"Did you have a good weekend?",es:"¿Tuviste un buen fin de semana?"}],
 prompts:[
  {en:"Say three things you did yesterday.",es:"Decí tres cosas que hiciste ayer."},
  {en:"What did you do last weekend?",es:"¿Qué hiciste el fin de semana pasado?"},
  {en:"Talk about the last movie or series you watched.",es:"Hablá de la última película o serie que viste."}]},
{n:6,m:2,title:"Contar historias",goal:"Narrar una anécdota completa usando conectores.",
 tip:"<h3>Mini-lección</h3>Una historia se sostiene con conectores: <em>first, then, after that, suddenly, finally</em>. Para el fondo de la escena usá pasado continuo: <em>I <b>was walking</b> home <b>when</b> I saw him</em> (estaba caminando cuando...). Practicá contando la misma anécdota varias veces: cada repetición sale más fluida.",
 phrases:[
  {en:"First, we went to the beach.",es:"Primero fuimos a la playa."},
  {en:"Then we had lunch by the sea.",es:"Después almorzamos junto al mar."},
  {en:"After that, we walked around town.",es:"Después de eso, paseamos por el pueblo."},
  {en:"Suddenly, it started to rain.",es:"De repente, empezó a llover."},
  {en:"Finally, we went back to the hotel.",es:"Finalmente, volvimos al hotel."},
  {en:"It was an amazing day.",es:"Fue un día increíble."},
  {en:"You won't believe what happened.",es:"No vas a creer lo que pasó."},
  {en:"I was walking home when I saw him.",es:"Estaba caminando a casa cuando lo vi."},
  {en:"Luckily, nothing bad happened.",es:"Por suerte, no pasó nada malo."},
  {en:"To make a long story short...",es:"Para hacerla corta..."}],
 prompts:[
  {en:"Tell the story of a trip you loved.",es:"Contá la historia de un viaje que te encantó."},
  {en:"Tell a funny thing that happened to you.",es:"Contá algo gracioso que te pasó."},
  {en:"Tell the same story again, but faster.",es:"Contá la misma historia otra vez, pero más rápido."}]},
{n:7,m:2,title:"Planes y futuro",goal:"Hablar de lo que viene: planes, deseos y promesas.",
 tip:"<h3>Mini-lección</h3>Tres formas de futuro: <em>going to</em> para planes decididos (<em>I'm going to visit my parents</em>), <em>will</em> para decisiones del momento y promesas (<em>I'll call you</em>), y <em>I'd like to</em> para deseos (<em>I'd like to travel</em>). El presente continuo también sirve para citas ya arregladas: <em>We're meeting at six</em>.",
 phrases:[

  {id:"learn", name:"Aprender", sub:"Frases nuevas con tarjetas", ico:"📖"},
  {id:"quiz", name:"Quiz", sub:"Elegí la traducción correcta", ico:"✅"},

/* ================= REPASO INTELIGENTE (Leitner) ================= */
WEEKS.forEach(w=>w.phrases.forEach((p,i)=>{ p.key = w.n+":"+i; p.week = w.n; }));
const DAY = 86400000;
const BOX_DAYS = [1,2,4,8,16]; // días hasta el próximo repaso según la caja (1-5)

/* ================= STATE ================= */
const KEY = "rutaIngles16";
let S = load();
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {weeks:{}, rate:0.9, free:false};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function wk(n){ if(!S.weeks[n]) S.weeks[n]={}; return S.weeks[n]; }
function modDone(n,m){ return !!wk(n)[m]; }
function weekDone(n){ return MODULES.every(mo=>modDone(n,mo.id)); }
function weekUnlocked(n){ return n===1 || S.free || weekDone(n-1); }
function totalPct(){
  let d=0; WEEKS.forEach(w=>MODULES.forEach(mo=>{ if(modDone(w.n,mo.id)) d++; }));
  return Math.round(100*d/(WEEKS.length*MODULES.length));
}
function items(){ if(!S.items) S.items={}; return S.items; }
function recordResult(p, ok){
  const it = items()[p.key] || {b:0, due:0};
  if(ok){ it.b = Math.min((it.b||0)+1, 5); it.due = Date.now() + BOX_DAYS[it.b-1]*DAY; }
  else  { it.b = 1; it.due = Date.now(); }
  items()[p.key] = it; save();
}
function seedWeek(w){
  w.phrases.forEach(p=>{ if(!items()[p.key]) items()[p.key] = {b:1, due:Date.now()+DAY}; });
  save();
}
function allPhrases(){ return WEEKS.flatMap(w=>w.phrases); }
function duePhrases(){
  const now = Date.now(), it = items();
  return allPhrases().filter(p=>it[p.key] && it[p.key].due<=now)
    .sort((a,b)=> it[a.key].b - it[b.key].b || it[a.key].due - it[b.key].due);
}
function reviewStats(){
  const it = items();
  const tracked = allPhrases().filter(p=>it[p.key]);
  const mastered = tracked.filter(p=>it[p.key].b>=4).length;
  let nextDue = null;
  tracked.forEach(p=>{ if(nextDue===null || it[p.key].due<nextDue) nextDue = it[p.key].due; });
  return {tracked:tracked.length, mastered, due:duePhrases().length, nextDue};
}

/* ================= AUDIO / SPEECH ================= */
let VOICE=null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v=>v.lang && v.lang.toLowerCase().startsWith("en"));
  VOICE = vs.find(v=>/en[-_]us/i.test(v.lang)) || vs[0] || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; if(VOICE) u.voice = VOICE;
  u.rate = rate || S.rate;
  speechSynthesis.speak(u);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
function listenOnce(onResult, onEnd){
  const r = new SR();
  r.lang="en-US"; r.interimResults=false; r.maxAlternatives=1;
  let got=false;
  r.onresult = e=>{ got=true; onResult(e.results[0][0].transcript); };
  r.onerror = ()=>{ if(!got) onResult(null); };
  r.onend = ()=>{ if(!got) onResult(null); if(onEnd) onEnd(); };
  try{ r.start(); }catch(e){ onResult(null); }
  return r;
}

/* ================= TEXT UTILS ================= */
function norm(s){
  return s.toLowerCase()
    .replace(/[’']/g,"'")
    .replace(/[.,!?;:"“”¿¡()]/g,"")
    .replace(/\s+/g," ").trim();
}
function lev(a,b){
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
function similarity(a,b){
  a=norm(a); b=norm(b);
  if(!a||!b) return 0;
  return 1 - lev(a,b)/Math.max(a.length,b.length);
}
function wordOverlap(target, said){
  const t = norm(target).split(" ");
  const s = new Set(norm(said).split(" "));
  let hit=0; t.forEach(w=>{ if(s.has(w)) hit++; });
  return hit/t.length;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

const app = document.getElementById("app");
function refreshGlobal(){
  const p = totalPct();
  document.getElementById("gbar").style.width = p+"%";
  document.getElementById("gpct").textContent = p+"%";
}
function goHome(){ renderHome(); window.scrollTo(0,0); }

function renderHome(){
  refreshGlobal();
  const done = WEEKS.filter(w=>weekDone(w.n)).length;
  const learned = WEEKS.reduce((acc,w)=> acc + (modDone(w.n,"learn") ? w.phrases.length : 0), 0);
  let html = `
  <div class="hero">
    <div class="eyebrow">Tu tutor personal · 4 hs semanales</div>
    <h1>De básico a conversación en 16 semanas</h1>
    <p class="lede">Una ruta guiada para aprender a <b>hablar</b> inglés: frases reales, quizzes, escucha con audio y práctica de habla con tu micrófono. Todo acá, a tu ritmo.</p>
  </div>
  <div class="stats">
    <div class="stat"><b>${done}/16</b><span>semanas completas</span></div>
    <div class="stat"><b>${learned}</b><span>frases aprendidas</span></div>
    <div class="stat"><b>${totalPct()}%</b><span>de la ruta</span></div>
  </div>`;
  const rs = reviewStats();
  const pctMastered = rs.tracked ? Math.round(10*rs.mastered/rs.tracked) : 0;
  let rcMsg, rcBtn;
  if(rs.tracked===0){ rcMsg = "Empezá el módulo Aprender de la semana 1 y tus frases entran acá solas."; rcBtn = ""; }
  else if(rs.due>0){ rcMsg = `Tenés <b>${rs.due} frase${rs.due===1?"":"s"}</b> esperándote hoy. Las que te cuestan vuelven seguido; las que dominás, cada vez menos.`; rcBtn = `<button class="btn" id="reviewBtn">Repasar ahora (${Math.min(rs.due,12)})</button>`; }
  else { const days = Math.max(1, Math.ceil((rs.nextDue-Date.now())/DAY)); rcMsg = `Todo al día ✓ — ${rs.mastered} de ${rs.tracked} frases dominadas. Próximo repaso ${days===1?"mañana":"en "+days+" días"}.`; rcBtn = `<button class="btn" disabled>Nada para repasar</button>`; }
  html += `<section class="review-card">
    <div class="rc-main"><h2>🔄 Repaso inteligente</h2><p>${rcMsg}</p>
    <div class="boxes" aria-label="Frases dominadas">${Array.from({length:10},(_,k)=>`<span class="${k<pctMastered?"f":""}"></span>`).join("")}</div></div>
    ${rcBtn}
  </section>`;
  MONTHS.forEach(mo=>{
    html += `<section class="month">
      <div class="month-h"><span class="mn">Mes ${mo.n} — ${mo.title}</span><span class="mt">${mo.sub}</span></div>
      <div class="weeks">`;
    WEEKS.filter(w=>w.m===mo.n).forEach(w=>{
      const unlocked = weekUnlocked(w.n);
      const dots = MODULES.map(m=>`<span class="dot ${modDone(w.n,m.id)?"on":""}"></span>`).join("");
      const state = weekDone(w.n) ? "✔" : unlocked ? "›" : "🔒";
      html += `<button class="week-row" data-w="${w.n}" ${unlocked?"":"disabled"} aria-label="Semana ${w.n}: ${esc(w.title)}${unlocked?"":" (bloqueada)"}">
        <span class="wnum">${w.n}</span>
        <span class="wmain"><span class="wtitle">${esc(w.title)}</span><br><span class="wgoal">${esc(w.goal)}</span><span class="dots" style="margin-top:5px">${dots}</span></span>
        <span class="wstate" style="color:${weekDone(w.n)?"var(--ok)":"var(--muted)"}">${state}</span>
      </button>`;
    });
    html += `</div></section>`;
  });
  html += `<section class="method">
    <h2>Cómo usar tu ruta (4 horas por semana)</h2>
    <ol>
      <li><b>Aprender + Quiz</b> (1 h, repartida en dos días): incorporá las 10 frases de la semana.</li>
      <li><b>Escuchá + Armá la frase</b> (1 h): entrená el oído y la estructura.</li>
      <li><b>Hablá</b> (1 h): repetí cada frase en voz alta y respondé las consignas con el micrófono. Es el bloque más importante.</li>
      <li><b>Repaso inteligente</b> (1 h, repartida en el resto de la semana): la app registra cada frase que acertás o fallás y te las trae de vuelta justo cuando estás por olvidarlas. Además, grabate los checkpoints de las semanas 4, 8, 12 y 16.</li>
    </ol>
    <p class="note">Regla de oro: todo en voz alta. Leer sin hablar no cuenta. Una semana se desbloquea al completar la anterior (podés activar el modo libre en ⚙).</p>
  </section>`;
  app.innerHTML = html;
  app.querySelectorAll(".week-row:not(:disabled)").forEach(b=>b.addEventListener("click",()=>renderWeek(+b.dataset.w)));
  const rb = document.getElementById("reviewBtn");
  if(rb) rb.addEventListener("click", runReview);
}

function renderWeek(n){
  refreshGlobal();
  const w = WEEKS.find(x=>x.n===n);
  let html = `<button class="back" id="back">‹ Volver a la ruta</button>
  <div class="wk-head">
    <div class="eyebrow">Mes ${w.m} · Semana ${w.n}</div>
    <h2>${esc(w.title)}</h2>
  </div>
  <div class="goalbox"><b>Meta de la semana:</b> ${esc(w.goal)}</div>
  <div class="tip">${w.tip}</div>
  <div class="mods">`;
  MODULES.forEach(m=>{
    const d = modDone(n,m.id);
    html += `<button class="mod-row ${d?"done":""}" data-m="${m.id}">
      <span class="mod-ico">${d?"✔":m.ico}</span>
      <span><span class="mod-name">${m.name}</span><br><span class="mod-sub">${m.sub}</span></span>
      ${d?'<span class="mod-check">Completado</span>':""}
    </button>`;
  });
  html += `</div>`;
  app.innerHTML = html;
  document.getElementById("back").addEventListener("click",goHome);
  app.querySelectorAll(".mod-row").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.m;
    ({learn:runLearn,quiz:runQuiz,listen:runListen,order:runOrder,speak:runSpeak})[id](w);
  }));
  window.scrollTo(0,0);
}

function exShell(w, title, inner){
  app.innerHTML = `<button class="back" id="back">‹ ${w?"Semana "+w.n:"Volver a la ruta"}</button>
  <div class="ex-top"><span class="ex-title">${title}</span><span class="ex-prog" id="exprog"></span></div>
  <div class="pbar"><div id="expbar" style="width:0%"></div></div>
  <div class="card" id="exbody">${inner||""}</div>`;
  document.getElementById("back").addEventListener("click",()=> w ? renderWeek(w.n) : goHome());
  window.scrollTo(0,0);
  return {
    body: document.getElementById("exbody"),
    prog: (i,total)=>{ document.getElementById("exprog").textContent = `${i}/${total}`;
      document.getElementById("expbar").style.width = (100*i/total)+"%"; }
  };
}
function finishModule(w, modId, msg){
  wk(w.n)[modId]=true; save(); refreshGlobal();
  const ui = exShell(w, "¡Listo!");
  const allDone = weekDone(w.n);
  ui.body.innerHTML = `<div class="exd center">
    <div style="font-size:2.2rem">🎉</div>
    <div class="result-big">${msg}</div>
    ${allDone?`<p>Completaste la <b>semana ${w.n}</b>. ${w.n<16?"Se desbloqueó la semana "+(w.n+1)+".":"¡Terminaste la ruta completa!"}</p>`:""}
    <div class="row">
      <button class="btn" id="cont">${allDone && w.n<16 ? "Ir a la semana "+(w.n+1) : "Seguir con la semana"}</button>
      <button class="btn ghost" id="home2">Ver la ruta</button>
    </div></div>`;
  document.getElementById("cont").addEventListener("click",()=> (allDone && w.n<16) ? renderWeek(w.n+1) : renderWeek(w.n));
  document.getElementById("home2").addEventListener("click",goHome);
}
function retryScreen(w, modId, score, need, total, runAgain){
  const ui = exShell(w, "Casi...");
  ui.body.innerHTML = `<div class="exd center">
    <div class="result-big">${score}/${total} correctas</div>
    <p>Necesitás ${need} para completar el módulo. ¡Repasá las frases y probá de nuevo — así se aprende!</p>
    <div class="row"><button class="btn" id="again">Intentar de nuevo</button>
    <button class="btn ghost" id="bk">Volver a la semana</button></div></div>`;
  document.getElementById("again").addEventListener("click",()=>runAgain(w));
  document.getElementById("bk").addEventListener("click",()=>renderWeek(w.n));
}

/* ---------- Módulo: Aprender (flashcards) ---------- */
function runLearn(w){
  let queue = shuffle(w.phrases.slice());
  let seen = 0; const total = w.phrases.length;
  const ui = exShell(w, "📖 Aprender");
  function card(){
    if(!queue.length){ seedWeek(w); return finishModule(w,"learn","Aprendiste las "+total+" frases de la semana"); }
    const p = queue[0];
    ui.prog(Math.min(seen,total), total);
    ui.body.innerHTML = `<div class="exd center">
      <p class="phrase-es">${esc(p.es)}</p>
      <p class="phrase-en" id="en" style="visibility:hidden">${esc(p.en)}</p>
      <div class="row" id="controls">
        <button class="btn" id="reveal">Ver en inglés</button>
      </div></div>`;
    document.getElementById("reveal").addEventListener("click",()=>{
      document.getElementById("en").style.visibility="visible";
      say(p.en);
      document.getElementById("controls").innerHTML = `
        <button class="btn sec" id="again">🔊 Escuchar de nuevo</button>
        <button class="btn ghost" id="hard">Repasar después</button>
        <button class="btn" id="know">La tengo ✓</button>`;
      document.getElementById("again").addEventListener("click",()=>say(p.en,0.7));
      document.getElementById("know").addEventListener("click",()=>{ queue.shift(); seen++; card(); });
      document.getElementById("hard").addEventListener("click",()=>{ queue.push(queue.shift()); card(); });
    });
  }
  card();
}

/* ---------- Módulo: Quiz ---------- */
function runQuiz(w){
  const items = shuffle(w.phrases.slice()).slice(0,8);
  const NEED = 6;
  let i=0, score=0;
  const ui = exShell(w, "✅ Quiz");
  function q(){
    if(i>=items.length){
      return score>=NEED ? finishModule(w,"quiz",`Quiz aprobado: ${score}/${items.length}`)
                         : retryScreen(w,"quiz",score,NEED,items.length,runQuiz);
    }
    ui.prog(i, items.length);
    const p = items[i];
    const sameWeek = shuffle(w.phrases.filter(x=>x.en!==p.en)).slice(0,2);
    const used = new Set([p.en, ...sameWeek.map(x=>x.en)]);
    const pool = WEEKS.flatMap(x=>x.phrases).filter(x=>!used.has(x.en));
    const distractors = sameWeek.concat(shuffle(pool).slice(0,1));
    const opts = shuffle([p, ...distractors.slice(0,3)]);
    ui.body.innerHTML = `<p class="phrase-es">¿Cómo se dice en inglés?</p>
      <p class="phrase-en" style="font-size:1.2rem">${esc(p.es)}</p>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.en)}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`;
    ui.body.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const chosen = opts[+b.dataset.k];
      ui.body.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      recordResult(p, chosen.en===p.en);
      const fb = document.getElementById("fb");
      if(chosen.en===p.en){ b.classList.add("right"); score++; fb.textContent="¡Correcta!"; fb.className="feedback ok"; }
      else{
        b.classList.add("wrong");
        ui.body.querySelectorAll(".opt").forEach(x=>{ if(opts[+x.dataset.k].en===p.en) x.classList.add("right"); });
        fb.textContent="La correcta era: "+p.en; fb.className="feedback bad";
      }
      say(p.en);
      setTimeout(()=>{ i++; q(); }, 1700);
    }));
  }
  q();
}

/* ---------- Módulo: Escuchá ---------- */
function runListen(w){
  const items = shuffle(w.phrases.slice()).slice(0,6);
  const NEED = 4;
  let i=0, score=0;
  const ui = exShell(w, "🎧 Escuchá");
  if(!("speechSynthesis" in window)){
    ui.body.innerHTML = `<div class="exd center"><p>Tu navegador no tiene voz sintetizada. Probá con Chrome, Edge o Safari.</p>
    <div class="row"><button class="btn ghost" id="bk">Volver</button></div></div>`;
    document.getElementById("bk").addEventListener("click",()=>renderWeek(w.n));
    return;
  }
  function q(){
    if(i>=items.length){
      return score>=NEED ? finishModule(w,"listen",`Buen oído: ${score}/${items.length}`)
                         : retryScreen(w,"listen",score,NEED,items.length,runListen);
    }
    ui.prog(i, items.length);
    const p = items[i];
    ui.body.innerHTML = `<div class="exd">
      <p class="phrase-es center">Escuchá y escribí la frase en inglés:</p>
      <div class="row">
        <button class="btn sec" id="play">🔊 Escuchar</button>
        <button class="btn ghost" id="slow">🐢 Más lento</button>
      </div>
      <input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribí lo que escuchaste..." style="margin-top:14px">
      <div class="feedback" id="fb"></div>
      <div class="row"><button class="btn" id="check">Corregir</button></div>
    </div>`;
    const play=()=>say(p.en), slow=()=>say(p.en,0.6);
    document.getElementById("play").addEventListener("click",play);
    document.getElementById("slow").addEventListener("click",slow);
    setTimeout(play, 300);
    const input = document.getElementById("ans");
    input.focus();
    let tries = 0;
    function check(){
      const val = input.value.trim();
      if(!val) return;
      const fb = document.getElementById("fb");
      const sim = similarity(val, p.en);
      if(sim >= 0.82){
        score++; recordResult(p,true); fb.textContent = "¡Muy bien! — "+p.en; fb.className="feedback ok";
        next();
      } else if(tries===0){
        tries++; fb.textContent = "No exactamente... escuchá de nuevo y probá otra vez (te queda 1 intento)."; fb.className="feedback bad";
        slow();
      } else {
        recordResult(p,false);
        fb.textContent = "Era: "+p.en; fb.className="feedback bad";
        say(p.en,0.7);
        next();
      }
    }
    function next(){
      document.getElementById("check").disabled = true; input.disabled = true;
      setTimeout(()=>{ i++; q(); }, 1800);
    }
    document.getElementById("check").addEventListener("click",check);
    input.addEventListener("keydown",e=>{ if(e.key==="Enter") check(); });
  }
  q();
}

/* ---------- Módulo: Armá la frase ---------- */
function runOrder(w){
  const items = shuffle(w.phrases.filter(p=>{
    const n=p.en.split(" ").length; return n>=4 && n<=9;
  })).slice(0,6);
  const NEED = Math.max(1, items.length-2);
  let i=0, score=0;
  const ui = exShell(w, "🧩 Armá la frase");
  function q(){
    if(i>=items.length){
      return score>=NEED ? finishModule(w,"order",`Estructura dominada: ${score}/${items.length}`)
                         : retryScreen(w,"order",score,NEED,items.length,runOrder);
    }
    ui.prog(i, items.length);
    const p = items[i];
    const words = p.en.split(" ");
    let bank = shuffle(words.map((wd,k)=>({wd,k})));
    // reshuffle if identical to the original order
    if(bank.every((b,idx)=>b.k===idx) && words.length>1) bank = bank.slice(1).concat(bank[0]);
    let placed = [];
    ui.body.innerHTML = `<p class="phrase-es center">${esc(p.es)}</p>
      <p class="note center" style="margin-bottom:14px">Tocá las palabras en orden:</p>
      <div class="chips" id="target" aria-label="Tu frase"></div>
      <div class="chips" id="bank" style="border-style:solid" aria-label="Palabras disponibles"></div>
      <div class="feedback center" id="fb"></div>
      <div class="row"><button class="btn" id="check" disabled>Corregir</button></div>`;
    const target = document.getElementById("target"), bankEl = document.getElementById("bank");
    function draw(){
      target.innerHTML = placed.map((b,idx)=>`<button class="chip placed" data-i="${idx}">${esc(b.wd)}</button>`).join("");
      bankEl.innerHTML = bank.map((b,idx)=>`<button class="chip" data-i="${idx}">${esc(b.wd)}</button>`).join("");
      target.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{ bank.push(placed.splice(+c.dataset.i,1)[0]); draw(); }));
      bankEl.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{ placed.push(bank.splice(+c.dataset.i,1)[0]); draw(); }));
      document.getElementById("check").disabled = bank.length>0;
    }
    draw();
    document.getElementById("check").addEventListener("click",()=>{
      const fb = document.getElementById("fb");
      const attempt = placed.map(b=>b.wd).join(" ");
      recordResult(p, attempt===p.en);
      if(attempt===p.en){ score++; fb.textContent="¡Perfecta!"; fb.className="feedback center ok"; }
      else{ fb.textContent="Era: "+p.en; fb.className="feedback center bad"; }
      say(p.en);
      document.getElementById("check").disabled=true;
      setTimeout(()=>{ i++; q(); }, 1800);
    });
  }
  q();
}

/* ---------- Módulo: Hablá ---------- */
function runSpeak(w){
  const phrases = shuffle(w.phrases.slice()).slice(0,6);
  const steps = phrases.map(p=>({type:"shadow",p})).concat(w.prompts.map(p=>({type:"prompt",p})));
  let i=0;
  const ui = exShell(w, "🎤 Hablá");
  const hasSR = !!SR;
  function step(){
    if(i>=steps.length) return finishModule(w,"speak","Práctica de habla completada");
    ui.prog(i, steps.length);
    const st = steps[i];
    if(st.type==="shadow"){
      ui.body.innerHTML = `<div class="exd center">
        <p class="phrase-es">${esc(st.p.es)}</p>
        <p class="phrase-en">${esc(st.p.en)}</p>
        <p class="note">Escuchala y repetila en voz alta, imitando el ritmo.</p>
        <div class="row">
          <button class="btn sec" id="play">🔊 Escuchar</button>
          ${hasSR?'<button class="mic idle" id="mic" aria-label="Grabar">🎙</button>':""}
        </div>
        <div class="transcript" id="tr" ${hasSR?"":"hidden"}>${hasSR?"Tocá el micrófono y repetí la frase...":""}</div>
        <div class="feedback center" id="fb"></div>
        <div class="row">
          ${hasSR?"":'<button class="btn sec" id="selfok">La dije bien ✓</button><button class="btn ghost" id="selfno">Me costó, repetir</button>'}
          <button class="btn" id="next" ${hasSR?"disabled":""} hidden>Siguiente ›</button>
        </div></div>`;
      const play=()=>say(st.p.en);
      document.getElementById("play").addEventListener("click",play);
      setTimeout(play,300);
      const nextBtn=document.getElementById("next");
      if(hasSR){
        const mic=document.getElementById("mic"), tr=document.getElementById("tr"), fb=document.getElementById("fb");
        mic.addEventListener("click",()=>{
          speechSynthesis.cancel();
          mic.classList.remove("idle"); tr.textContent="Escuchando... hablá ahora";
          listenOnce(text=>{
            mic.classList.add("idle");
            if(text===null){ tr.textContent="No te escuché — revisá el permiso del micrófono, o tocá y probá de nuevo."; nextBtn.hidden=false; nextBtn.disabled=false; return; }
            tr.textContent = "“"+text+"”";
            const ov = wordOverlap(st.p.en, text);
            if(ov>=0.7){ recordResult(st.p,true); fb.innerHTML='<span class="score-pill ok">¡Muy bien! 🎉</span>'; }
            else if(ov>=0.4){ fb.innerHTML='<span class="score-pill mid">Casi — escuchala de nuevo y repetí</span>'; }
            else{ recordResult(st.p,false); fb.innerHTML='<span class="score-pill bad">Probá otra vez, más despacio</span>'; }
            nextBtn.hidden=false; nextBtn.disabled=false;
          });
        });
      } else {
        document.getElementById("selfok").addEventListener("click",()=>{ recordResult(st.p,true); i++; step(); });
        document.getElementById("selfno").addEventListener("click",()=>{ say(st.p.en,0.7); });
        nextBtn.hidden=true;
      }
      nextBtn.addEventListener("click",()=>{ i++; step(); });
    } else {
      ui.body.innerHTML = `<div class="exd center">
        <div class="eyebrow" style="margin-bottom:6px">Consigna abierta</div>
        <p class="phrase-en" style="font-size:1.25rem">${esc(st.p.en)}</p>
        <p class="phrase-es">${esc(st.p.es)}</p>
        <p class="note">Respondé en voz alta, mínimo 30 segundos. No busques la perfección: comunicá.</p>
        <div class="row">
          <button class="btn sec" id="play">🔊 Escuchar la consigna</button>
          ${hasSR?'<button class="mic idle" id="mic" aria-label="Grabar">🎙</button>':""}
        </div>
        <div class="transcript" id="tr" ${hasSR?"":"hidden"}>${hasSR?"Tocá el micrófono y respondé — vas a ver lo que dijiste acá.":""}</div>
        <div class="row"><button class="btn" id="next">Hecho, siguiente ›</button></div>
      </div>`;
      document.getElementById("play").addEventListener("click",()=>say(st.p.en));
      if(hasSR){
        const mic=document.getElementById("mic"), tr=document.getElementById("tr");
        mic.addEventListener("click",()=>{
          speechSynthesis.cancel();
          mic.classList.remove("idle"); tr.textContent="Escuchando... hablá ahora";
          listenOnce(text=>{
            mic.classList.add("idle");
            tr.textContent = text===null ? "No te escuché — probá de nuevo." : "“"+text+"”";
          });
        });
      }
      document.getElementById("next").addEventListener("click",()=>{ i++; step(); });
    }
  }
  step();
}

/* ---------- Repaso inteligente ---------- */
function reviewType(p){
  const b = items()[p.key].b || 1;
  const nWords = p.en.split(" ").length;
  if(b<=1) return "flash";
  if(b===2) return "mc";
  if(b===3) return (nWords>=4 && nWords<=9) ? "order" : "mc";
  if(b>=5 && SR) return "speak";
  return ("speechSynthesis" in window) ? "listen" : "mc";
}
function runReview(){
  const session = duePhrases().slice(0,12);
  if(!session.length) return goHome();
  let i=0, right=0;
  const ui = exShell(null, "🔄 Repaso inteligente");
  function grade(ok){ recordResult(session[i], ok); if(ok) right++; i++; step(); }
  function step(){
    if(i>=session.length){
      refreshGlobal();
      const left = duePhrases().length;
      ui.prog(session.length, session.length);
      ui.body.innerHTML = `<div class="exd center">
        <div style="font-size:2.2rem">${right>=session.length*0.7?"🎉":"💪"}</div>
        <div class="result-big">${right}/${session.length} correctas</div>
        <p>${right===session.length?"Impecable — esas frases van a tardar más en volver.":"Las que fallaste vuelven a la cola de hoy: repetirlas es exactamente cómo se fijan."}</p>
        <div class="row">
          ${left>0?`<button class="btn" id="more">Seguir repasando (${Math.min(left,12)})</button>`:""}
          <button class="btn ${left>0?"ghost":""}" id="home3">Volver a la ruta</button>
        </div></div>`;
      const more = document.getElementById("more");
      if(more) more.addEventListener("click", runReview);
      document.getElementById("home3").addEventListener("click", goHome);
      return;
    }
    ui.prog(i, session.length);
    const p = session[i];
    ({flash:rvFlash, mc:rvMC, order:rvOrder, listen:rvListen, speak:rvSpeak})[reviewType(p)](ui, p, grade);
  }
  step();
}
function rvFlash(ui, p, done){
  ui.body.innerHTML = `<div class="exd center">
    <p class="phrase-es">¿Cómo se dice?</p>
    <p class="phrase-en" style="font-size:1.2rem">${esc(p.es)}</p>
    <p class="phrase-en" id="en" style="visibility:hidden">${esc(p.en)}</p>
    <div class="row" id="controls"><button class="btn" id="reveal">Ver la respuesta</button></div></div>`;
  document.getElementById("reveal").addEventListener("click",()=>{
    document.getElementById("en").style.visibility="visible";
    say(p.en);
    document.getElementById("controls").innerHTML = `
      <button class="btn ghost" id="no">No me acordaba</button>
      <button class="btn" id="yes">La sabía ✓</button>`;
    document.getElementById("yes").addEventListener("click",()=>done(true));
    document.getElementById("no").addEventListener("click",()=>done(false));
  });
}
function rvMC(ui, p, done){
  const sameWeek = shuffle(WEEKS.find(x=>x.n===p.week).phrases.filter(x=>x.en!==p.en)).slice(0,2);
  const used = new Set([p.en, ...sameWeek.map(x=>x.en)]);
  const pool = allPhrases().filter(x=>!used.has(x.en));
  const opts = shuffle([p, ...sameWeek, ...shuffle(pool).slice(0,1)].slice(0,4));
  ui.body.innerHTML = `<p class="phrase-es">¿Cómo se dice en inglés?</p>
    <p class="phrase-en" style="font-size:1.2rem">${esc(p.es)}</p>
    <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.en)}</button>`).join("")}</div>
    <div class="feedback" id="fb"></div>`;
  ui.body.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const ok = opts[+b.dataset.k].en===p.en;
    ui.body.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    const fb = document.getElementById("fb");
    if(ok){ b.classList.add("right"); fb.textContent="¡Correcta!"; fb.className="feedback ok"; }
    else{
      b.classList.add("wrong");
      ui.body.querySelectorAll(".opt").forEach(x=>{ if(opts[+x.dataset.k].en===p.en) x.classList.add("right"); });
      fb.textContent="La correcta era: "+p.en; fb.className="feedback bad";
    }
    say(p.en);
    setTimeout(()=>done(ok), 1700);
  }));
}
function rvOrder(ui, p, done){
  const words = p.en.split(" ");
  let bank = shuffle(words.map((wd,k)=>({wd,k})));
  if(bank.every((b,idx)=>b.k===idx) && words.length>1) bank = bank.slice(1).concat(bank[0]);
  let placed = [];
  ui.body.innerHTML = `<p class="phrase-es center">${esc(p.es)}</p>
    <p class="note center" style="margin-bottom:14px">Tocá las palabras en orden:</p>
    <div class="chips" id="target"></div>
    <div class="chips" id="bank" style="border-style:solid"></div>
    <div class="feedback center" id="fb"></div>
    <div class="row"><button class="btn" id="check" disabled>Corregir</button></div>`;
  const target = document.getElementById("target"), bankEl = document.getElementById("bank");
  function draw(){
    target.innerHTML = placed.map((b,idx)=>`<button class="chip placed" data-i="${idx}">${esc(b.wd)}</button>`).join("");
    bankEl.innerHTML = bank.map((b,idx)=>`<button class="chip" data-i="${idx}">${esc(b.wd)}</button>`).join("");
    target.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{ bank.push(placed.splice(+c.dataset.i,1)[0]); draw(); }));
    bankEl.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{ placed.push(bank.splice(+c.dataset.i,1)[0]); draw(); }));
    document.getElementById("check").disabled = bank.length>0;
  }
  draw();
  document.getElementById("check").addEventListener("click",()=>{
    const ok = placed.map(b=>b.wd).join(" ")===p.en;
    const fb = document.getElementById("fb");
    fb.textContent = ok ? "¡Perfecta!" : "Era: "+p.en;
    fb.className = "feedback center "+(ok?"ok":"bad");
    say(p.en);
    document.getElementById("check").disabled=true;
    setTimeout(()=>done(ok), 1800);
  });
}
function rvListen(ui, p, done){
  ui.body.innerHTML = `<div class="exd">
    <p class="phrase-es center">Escuchá y escribí la frase en inglés:</p>
    <div class="row">
      <button class="btn sec" id="play">🔊 Escuchar</button>
      <button class="btn ghost" id="slow">🐢 Más lento</button>
    </div>
    <input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribí lo que escuchaste..." style="margin-top:14px">
    <div class="feedback" id="fb"></div>
    <div class="row"><button class="btn" id="check">Corregir</button></div></div>`;
  const play=()=>say(p.en), slow=()=>say(p.en,0.6);
  document.getElementById("play").addEventListener("click",play);
  document.getElementById("slow").addEventListener("click",slow);
  setTimeout(play, 300);
  const input = document.getElementById("ans");
  input.focus();
  let tries = 0;
  function check(){
    const val = input.value.trim();
    if(!val) return;
    const fb = document.getElementById("fb");
    if(similarity(val, p.en) >= 0.82){
      fb.textContent = "¡Muy bien! — "+p.en; fb.className="feedback ok"; end(true);
    } else if(tries===0){
      tries++; fb.textContent = "No exactamente... probá una vez más."; fb.className="feedback bad"; slow();
    } else {
      fb.textContent = "Era: "+p.en; fb.className="feedback bad"; say(p.en,0.7); end(false);
    }
  }
  function end(ok){
    document.getElementById("check").disabled = true; input.disabled = true;
    setTimeout(()=>done(ok), 1800);
  }
  document.getElementById("check").addEventListener("click",check);
  input.addEventListener("keydown",e=>{ if(e.key==="Enter") check(); });
}
function rvSpeak(ui, p, done){
  ui.body.innerHTML = `<div class="exd center">
    <p class="phrase-es">Decilo en inglés, en voz alta:</p>
    <p class="phrase-en" style="font-size:1.2rem">${esc(p.es)}</p>
    <p class="phrase-en" id="en" style="visibility:hidden">${esc(p.en)}</p>
    <div class="row"><button class="mic idle" id="mic" aria-label="Grabar">🎙</button></div>
    <div class="transcript" id="tr">Tocá el micrófono y decí la frase en inglés...</div>
    <div class="feedback center" id="fb"></div>
    <div class="row" id="controls"></div></div>`;
  const mic=document.getElementById("mic"), tr=document.getElementById("tr"), fb=document.getElementById("fb");
  function finishWith(ok){
    document.getElementById("en").style.visibility="visible";
    say(p.en);
    document.getElementById("controls").innerHTML = `<button class="btn" id="next">Siguiente ›</button>`;
    document.getElementById("next").addEventListener("click",()=>done(ok));
  }
  mic.addEventListener("click",()=>{
    speechSynthesis.cancel();
    mic.classList.remove("idle"); tr.textContent="Escuchando... hablá ahora";
    listenOnce(text=>{
      mic.classList.add("idle");
      if(text===null){ tr.textContent="No te escuché — probá de nuevo, o pasá con el botón."; finishWith(false); return; }
      tr.textContent = "“"+text+"”";
      const ov = wordOverlap(p.en, text);
      if(ov>=0.6){ fb.innerHTML='<span class="score-pill ok">¡Muy bien! 🎉</span>'; finishWith(true); }
      else{ fb.innerHTML='<span class="score-pill bad">No era exactamente así</span>'; finishWith(false); }
    });
  });
}
